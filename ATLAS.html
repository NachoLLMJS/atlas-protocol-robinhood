function CreateIndexView({ setView, wallet }) {
  const liveStocks = STOCKS.filter(s => s.live && s.token);
  const [idxName, setIdxName] = useState('');
  const [idxSymbol, setIdxSymbol] = useState('');
  const [selected, setSelected] = useState([]);
  const [feePct, setFeePct] = useState('0.3');
  const [deploying, setDeploying] = useState(false);
  const [result, setResult] = useState(null);
  const labelStyle = {fontFamily:'var(--mono)', fontSize:10, letterSpacing:'.28em', textTransform:'uppercase', color:'var(--ink-soft)', display:'block', marginBottom:8};
  const inputStyle = {width:'100%', padding:'10px 14px', border:'1px solid var(--ink)', background:'var(--paper)', fontFamily:'var(--display)', fontSize:18, letterSpacing:'.06em', color:'var(--ink)', outline:'none'};

  const toggleStock = (ticker) => {
    setSelected(prev => prev.includes(ticker) ? prev.filter(t => t !== ticker) : prev.length < 5 ? [...prev, ticker] : prev);
  };

  const deploy = async () => {
    if (!FACTORY_ADDRESS) { setResult({ status: 'error', message: 'Mainnet factory is not deployed yet. Deployment is intentionally disabled.' }); return; }
    if (!wallet) { alert('Connect your wallet first'); return; }
    if (!idxName || !idxSymbol || selected.length < 2) { alert('Fill name, symbol, and select 2-5 stocks'); return; }
    setDeploying(true);
    try {
      const stockAddrs = selected.map(t => STOCKS.find(s => s.ticker === t).token);
      const equalWeight = Math.floor(10000 / selected.length);
      const weightArr = selected.map((_, i) => i === 0 ? 10000 - equalWeight * (selected.length - 1) : equalWeight);
      const feeBps = Math.round(parseFloat(feePct) * 100);
      const factory = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, wallet.signer);
      const tx = await factory.createIndex(idxName, idxSymbol.toUpperCase(), stockAddrs, weightArr, feeBps);
      setResult({ status: 'pending', tx: tx.hash });
      const receipt = await tx.wait();
      // Get index address from event
      const event = receipt.logs.find(l => {
        try { return factory.interface.parseLog(l)?.name === 'IndexCreated'; } catch { return false; }
      });
      const indexAddr = event ? factory.interface.parseLog(event).args[0] : 'Check explorer';
      // Reload indices
      await loadDeployedIndices(wallet.provider);
      setResult({ status: 'success', tx: tx.hash, address: indexAddr });
    } catch (err) {
      setResult({ status: 'error', message: err.reason || err.message });
    }
    setDeploying(false);
  };

  return <>
    <div className="crumbs"><div className="path">Dashboard / <b>Create Index</b></div><div className="actions"><XButton /></div></div>
    <div className="sec-title" style={{marginTop:18}}><h2>Create New Index</h2><span className="ornament">&#10022; &#10022; &#10022;</span></div>
    <p style={{fontFamily:'var(--sans)', fontSize:14, color:'var(--ink-soft)', lineHeight:1.6, maxWidth:600, marginBottom:24}}>
      Deploy a real ERC-20 index token on Robinhood Chain. Select 2-5 stocks, set your fee, and deploy.
    </p>
    <div style={{border:'1px solid var(--ink)', padding:28, maxWidth:620, background:'var(--paper)', clipPath:'polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%)'}}>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:20}}>
        <div>
          <label style={labelStyle}>Index Name</label>
          <input style={inputStyle} placeholder="e.g. Tech Titans" value={idxName} onChange={e => setIdxName(e.target.value)} />
        </div>
        <div>
          <label style={labelStyle}>Ticker Symbol</label>
          <input style={{...inputStyle, fontFamily:'var(--mono)'}} placeholder="e.g. TECH" value={idxSymbol} onChange={e => setIdxSymbol(e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,5))} />
        </div>
      </div>
      <div style={{marginBottom:20}}>
        <label style={labelStyle}>Select Stocks (2-5) {selected.length > 0 && `· ${selected.length} selected`}</label>
        <div style={{display:'grid', gridTemplateColumns:'repeat(5, 1fr)', gap:8}}>
          {liveStocks.map(s => {
            const active = selected.includes(s.ticker);
            return <div key={s.ticker} onClick={() => toggleStock(s.ticker)} style={{
              border: active ? '2px solid var(--ink)' : '1px solid var(--rule)',
              padding:'12px 8px', textAlign:'center', cursor:'pointer', transition:'all .15s',
              background: active ? 'rgba(94,121,178,.1)' : 'transparent',
              boxShadow: active ? '3px 3px 0 var(--ink-2)' : 'none',
            }}>
              <div style={{fontFamily:'var(--display)', fontSize:15, fontWeight:600, letterSpacing:'.1em'}}>{s.ticker}</div>
              <div style={{fontFamily:'var(--mono)', fontSize:9, color:'var(--ink-soft)', marginTop:4}}>${s.price.toFixed(0)}</div>
              {active && <div style={{fontFamily:'var(--mono)', fontSize:9, color:'var(--blue)', marginTop:4}}>{Math.floor(10000/selected.length)/100}%</div>}
            </div>;
          })}
        </div>
      </div>
      <div style={{marginBottom:24}}>
        <label style={labelStyle}>Creator Fee (%)</label>
        <input style={{...inputStyle, width:120, fontFamily:'var(--mono)', fontSize:14}} value={feePct}
          onChange={e => { const v = e.target.value; if (/^\d*\.?\d*$/.test(v) && parseFloat(v || '0') <= 5) setFeePct(v); }} />
      </div>

      {result?.status === 'success' ? <div style={{border:'1px solid var(--green)', padding:16, marginBottom:16, background:'rgba(59,140,110,.06)'}}>
        <div style={{fontFamily:'var(--display)', fontWeight:600, fontSize:16, color:'var(--green)', marginBottom:8}}>Index Deployed Successfully</div>
        <div style={{fontFamily:'var(--mono)', fontSize:11, color:'var(--ink-soft)', wordBreak:'break-all'}}>
          Address: <a href={RH_EXPLORER.replace('/token/','/address/') + result.address} target="_blank" style={{color:'var(--blue)'}}>{result.address}</a>
        </div>
        <div style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--ink-mute)', marginTop:4}}>Tx: {result.tx}</div>
      </div> : result?.status === 'error' ? <div style={{border:'1px solid var(--red)', padding:16, marginBottom:16}}>
        <div style={{fontFamily:'var(--mono)', fontSize:12, color:'var(--red)'}}>{result.message}</div>
      </div> : result?.status === 'pending' ? <div style={{border:'1px solid var(--blue)', padding:16, marginBottom:16}}>
        <div style={{fontFamily:'var(--mono)', fontSize:12, color:'var(--blue)'}}>Transaction pending... {result.tx.slice(0,14)}...</div>
      </div> : null}

      <div style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--ochre)', marginBottom:16}}>MAINNET FACTORY: LIVE · contracts are not externally audited.</div>
      <button className="btn primary" style={{padding:'12px 24px', fontSize:12}} onClick={deploy} disabled={deploying || !wallet || !FACTORY_ADDRESS}>
        {!FACTORY_ADDRESS ? 'Mainnet Deployment Pending' : !wallet ? 'Connect Wallet First' : deploying ? 'Deploying...' : `Deploy $${idxSymbol || 'INDEX'} on Robinhood Chain`}
      </button>
    </div>
  </>;
}

// ─── DOCS VIEW ───
function DocsView() {
  const section = { marginBottom:34 };
  const h2 = {fontFamily:'var(--display)', fontSize:26, letterSpacing:'.04em', margin:'0 0 14px', borderBottom:'1px solid var(--ink)', paddingBottom:10};
  const p = {fontFamily:'var(--sans)', fontSize:13, color:'var(--ink-soft)', lineHeight:1.75, maxWidth:820};
  const table = {width:'100%', borderCollapse:'collapse', margin:'14px 0 22px', fontFamily:'var(--mono)', fontSize:10};
  const th = {textAlign:'left', padding:'9px 10px', border:'1px solid var(--ink)', background:'rgba(94,121,178,.08)', letterSpacing:'.12em', textTransform:'uppercase'};
  const td = {padding:'9px 10px', border:'1px solid var(--rule)', wordBreak:'break-word'};
  return <>
    <div className="crumbs"><div className="path">Dashboard / <b>Documentation</b></div><div className="actions"><XButton /></div></div>
    <div className="sec-title" style={{marginTop:18}}><h2>Mainnet Technical Status</h2><span className="ornament">&#10022; &#10022; &#10022;</span></div>

    <section style={section}>
      <h2 style={h2}>Launch Status</h2>
      <p style={p}><b>ATLAS Factory and Router are deployed on Robinhood Chain Mainnet; canonical Stock Token swaps use live-validated LI.FI aggregate quotes.</b> Creation and ETH-based index routing are enabled. The vulnerable legacy AtlasVault and fixed-price StockPaymentVault remain excluded.</p>
      <table style={table}><tbody>
        <tr><td style={td}>Network configuration</td><td style={td}><span style={{color:'var(--green)'}}>Verified</span></td></tr>
        <tr><td style={td}>Canonical Stock Tokens</td><td style={td}><span style={{color:'var(--green)'}}>Verified via official API and RPC bytecode</span></td></tr>
        <tr><td style={td}>MainnetIndexFactory</td><td style={td}><span style={{color:'var(--green)'}}>Deployed · 0xf920Cd56...e5f0c</span></td></tr>
        <tr><td style={td}>MainnetIndexRouter</td><td style={td}><span style={{color:'var(--green)'}}>Deployed · 0x606f0599...CeB7A</span></td></tr>
        <tr><td style={td}>External audit / legal review</td><td style={td}><span style={{color:'var(--red)'}}>Still required</span></td></tr>
      </tbody></table>
    </section>

    <section style={section}>
      <h2 style={h2}>Robinhood Chain Mainnet</h2>
      <table style={table}>
        <thead><tr><th style={th}>Parameter</th><th style={th}>Value</th></tr></thead>
        <tbody>
          <tr><td style={td}>Chain ID</td><td style={td}>4663 · 0x1237</td></tr>
          <tr><td style={td}>RPC</td><td style={td}>https://rpc.mainnet.chain.robinhood.com</td></tr>
          <tr><td style={td}>Explorer</td><td style={td}>https://robinhoodchain.blockscout.com</td></tr>
          <tr><td style={td}>Gas asset</td><td style={td}>ETH</td></tr>
        </tbody>
      </table>
      <p style={p}>ATLAS currently supports five canonical 18-decimal Stock Tokens: TSLA, AMZN, NFLX, AMD and PLTR. Their addresses are shown in the Stocks view and sourced from the official Robinhood asset endpoint. Portfolio quantities use ERC-8056 <code>uiMultiplier()</code>, so splits and other corporate actions are reflected as underlying-share units while transfers and collateral remain in raw ERC-20 units.</p>
    </section>

    <section style={section}>
      <h2 style={h2}>Mainnet Contract Model</h2>
      <p style={p}>MainnetIndexFactory restricts baskets to an owner-managed allowlist of canonical Stock Tokens, rejects duplicate/zero-weight components and deploys immutable MainnetIndexToken contracts. Factory ownership uses a two-step transfer.</p>
      <p style={p}>Mint is directly collateralized: the user approves every underlying token and the index contract verifies the exact balance increase before minting. The immutable fee is split 50/50 between creator and treasury. Burn returns the deterministic raw-unit basket and never distributes accidental donations or surplus. Transfers use OpenZeppelin SafeERC20 and mint/burn are protected against reentrancy.</p>
      <p style={p}>MainnetIndexRouter restores the testnet-style ETH buy/sell experience without using LP inventory: it executes component swaps only against the fixed LI.FI Diamond, verifies every received collateral delta, atomically mints the index, and refunds excess assets. The reverse path burns the index, swaps each redeemed component to ETH, and enforces aggregate minimum output.</p>
      <div style={{...p, border:'1px solid var(--red)', padding:14}}>Composition weights define token-unit backing, not USD-value weights. A value-weighted index would require a separately specified and audited oracle/rebalancing design.</div>
    </section>

    <section style={section}>
      <h2 style={h2}>AI Terminal Security</h2>
      <p style={p}>The browser sends bounded history and public protocol context only to <code>/api/chat</code>. The OpenAI credential, base URL, system prompt and fallback model order exist only in the serverless runtime. Provider errors are sanitized, request sizes are limited, and authentication/quota failures stop immediately instead of cycling through every fallback.</p>
      <p style={p}>Primary model: GPT-4.1 mini. Fallback: GPT-4.1 nano. Every request uses a strict JSON Schema and every response is validated again server-side before the browser receives an action.</p>
      <p style={p}>No model can execute a transaction directly. The browser validates the action, displays confirmation and MetaMask remains the signing boundary. Explicit <code>buy_stock</code> and <code>sell_stock</code> actions use the same live-validated LI.FI aggregate quote path as the Stocks view; legacy vault actions remain unavailable.</p>
    </section>

    <section style={section}>
      <h2 style={h2}>Deployment Guards</h2>
      <p style={p}>The mainnet script compiles in memory and performs read-only preflight by default. Factory and Router were deployed through the guarded path; the confirmation was relocked immediately afterward. Re-deployment still requires the private key, non-zero treasury, exact confirmation phrase, HTTPS RPC, Chain ID 4663 and canonical contract bytecode.</p>
      <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
        <a className="btn" href="https://docs.robinhood.com/chain/connecting" target="_blank" rel="noopener noreferrer">Network Docs</a>
        <a className="btn" href="https://docs.robinhood.com/chain/contracts" target="_blank" rel="noopener noreferrer">Token Contracts</a>
        <a className="btn" href="https://api.robinhood.com/rhj/assets" target="_blank" rel="noopener noreferrer">Official Asset API</a>
      </div>
    </section>
  </>;
}

// ─── RAIL ───
function RightRail({ setView }) {
  return <aside className="rail">
    <div className="rail-section">
      <div className="rail-kicker">AI Agent</div>
      <h3>Terminal <span className="deco">&middot; &#10057;</span></h3>
      <div className="terminal-mini" onClick={() => setView('terminal')} style={{cursor:'pointer'}}>
        <div className="tbody">
          <div><span className="prompt">&gt;</span> show TSLA price</div>
          <div className="response">Live price data is read-only.</div>
          <div className="success" style={{color:'var(--blue)'}}>Example · no transaction executed.</div>
          <br/>
          <div style={{color:'var(--ink-mute)', fontSize:10, letterSpacing:'.15em'}}>Click to open full terminal &rarr;</div>
        </div>
      </div>
    </div>
    <div className="rail-section">
      <div className="rail-kicker">On-Chain</div>
      <h3>Index Funds <span className="deco">&middot; &#10022;</span></h3>
      {DEPLOYED_INDICES.length > 0
        ? DEPLOYED_INDICES.map((idx, i) => <div key={i} className="feed-item">
            <div className="feed-row"><span className="feed-action">{idx.symbol}</span><span className="feed-tag create">live</span></div>
            <div className="feed-detail">{idx.name} ({idx.stocks.join(', ')})</div>
            <div className="feed-time">Supply: {idx.totalSupply.toFixed(2)}</div>
          </div>)
        : <div style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--ink-mute)', padding:'12px 0'}}>No indices deployed yet</div>
      }
    </div>
    <div className="rail-section">
      <div className="rail-kicker">Protocol</div>
      <h3>Factory <span className="deco">&middot; &#9830;</span></h3>
      <div className="treas-value">{DEPLOYED_INDICES.length}<span className="unit">index</span></div>
      <div className="treas-delta">{STOCKS.filter(s=>s.live).length} stocks live</div>
      <div className="treas-breakdown">
        <div className="treas-row"><span>Supply</span><b>{DEPLOYED_INDICES.reduce((s,i)=>s+i.totalSupply,0).toFixed(1)}</b></div>
        <div className="treas-row"><span>Stocks</span><b>{STOCKS.filter(s=>s.live).map(s=>s.ticker).join(', ')}</b></div>
        <div className="treas-row"><span>Chain</span><b>RH Mainnet</b></div>
      </div>
    </div>
  </aside>;
}

// ─── APP ───
function App() {
  const validViews = ['overview','indices','stocks','terminal','portfolio','treasury','create','liquidity','docs'];
  const hashView = window.location.hash.replace('#','');
  const [view, setView] = useState(validViews.includes(hashView) ? hashView : 'overview');
  const { wallet, balances, loading: walletLoading, connect: connectW, refresh: refreshBalances } = useWallet();
  const { pricesLoaded, lastUpdate } = useLivePrices();
  // Force re-render when prices update
  const [, forceUpdate] = useState(0);
  useEffect(() => { if (lastUpdate) forceUpdate(n => n + 1); }, [lastUpdate]);

  // Load indices on startup without wallet (public RPC)
  useEffect(() => {
    if (DEPLOYED_INDICES.length === 0 && !wallet) {
      const pub = new ethers.JsonRpcProvider('https://rpc.mainnet.chain.robinhood.com');
      loadDeployedIndices(pub).then(() => forceUpdate(n => n + 1));
    }
  }, []);

  useEffect(() => {
    function onHash(){ const v = window.location.hash.replace('#',''); if(validViews.includes(v)) setView(v); }
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const menuItems = [
    { group:'Markets', items: [
      { key:'overview', num:'I.', label:'Overview' },
      { key:'indices', num:'II.', label:'Index' },
      { key:'stocks', num:'III.', label:'Stocks' },
    ]},
    { group:'Trade', items: [
      { key:'terminal', num:'IV.', label:'Terminal' },
      { key:'portfolio', num:'V.', label:'Portfolio' },
    ]},
    { group:'Protocol', items: [
      { key:'treasury', num:'VI.', label:'Treasury' },
      { key:'create', num:'VII.', label:'Create Index' },
      { key:'liquidity', num:'VIII.', label:'Liquidity' },
      { key:'docs', num:'IX.', label:'Documentation' },
    ]},
  ];

  const showRail = view === 'overview' || view === 'indices' || view === 'stocks';

  return <div className={`app ${showRail ? 'has-rail' : ''}`}>
    <aside className="nav">
      <div className="brand">
        <div className="brand-seal" aria-hidden="true">
          <img src="assets/brand/atlas-header-mark.png" alt="" />
        </div>
        <div>
          <div className="brand-name">ATLAS</div>
          <div className="brand-sub">Stock Index Protocol</div>
        </div>
      </div>
      <div className="agent-status">
        <div className="agent-row"><span className="agent-dot"/> AI &middot; Server Proxy</div>
        <div className="agent-mode">Mode &middot; {view === 'terminal' ? 'Terminal · OpenAI' : 'Server-managed'}</div>
        {wallet
          ? <div className="agent-mode" style={{color:'var(--green)'}}>{wallet.address.slice(0,6)}...{wallet.address.slice(-4)} &middot; {(balances.ETH || 0).toFixed(4)} ETH</div>
          : <div className="agent-mode" style={{color:'var(--ink-mute)', cursor:'pointer', textDecoration:'underline'}} onClick={connectW}>{walletLoading ? 'Connecting...' : 'Connect Wallet'}</div>
        }
      </div>
      <nav className="menu">
        {menuItems.map(g => <React.Fragment key={g.group}>
          <div className="menu-label">{g.group}</div>
          {g.items.map(item =>
            <div key={item.key} className={`menu-item ${view === item.key ? 'active' : ''}`} onClick={() => setView(item.key)}>
              <span className="num">{item.num}</span> {item.label}
            </div>
          )}
        </React.Fragment>)}
      </nav>
      <div className="nav-footer">
        <div><span className="k">Network</span> &nbsp;{wallet ? <span style={{color:'var(--green)'}}>Robinhood Chain</span> : 'Robinhood Chain'}</div>
        <div><span className="k">Protocol</span> &nbsp;ATLAS Index v1</div>
        <div><span className="k">Prices</span> &nbsp;{pricesLoaded ? <span style={{color:'var(--green)'}}>Live</span> : 'Cached'}</div>
        <div><span className="k">Build</span> &nbsp;<b>v0.1.0 &middot; mainnet live</b></div>
        <a href="https://docs.robinhood.com/chain/contracts" target="_blank" rel="noopener noreferrer" style={{display:'block', marginTop:10, padding:'6px 10px', border:'1px solid var(--green)', color:'var(--green)', textAlign:'center', fontFamily:'var(--mono)', fontSize:9, letterSpacing:'.14em', textTransform:'uppercase', textDecoration:'none'}}>Get Mainnet Stocks</a>
      </div>
    </aside>

    <main>
      {view === 'overview' && <OverviewView setView={setView} wallet={wallet} balances={balances} connectW={connectW} walletLoading={walletLoading} refreshBalances={refreshBalances}/>}
      {view === 'indices' && <IndicesView setView={setView} wallet={wallet} balances={balances} refreshBalances={refreshBalances}/>}
      {view === 'stocks' && <StocksView wallet={wallet} balances={balances} refreshBalances={refreshBalances} connectW={connectW} walletLoading={walletLoading}/>}
      {view === 'terminal' && <TerminalView wallet={wallet} balances={balances} refreshBalances={refreshBalances} connectW={connectW} walletLoading={walletLoading}/>}
      {view === 'portfolio' && <PortfolioView wallet={wallet} balances={balances} connectW={connectW} walletLoading={walletLoading}/>}
      {view === 'treasury' && <TreasuryView/>}
      {view === 'create' && <CreateIndexView setView={setView} wallet={wallet}/>}
      {view === 'liquidity' && <LiquidityView setView={setView}/>}
      {view === 'docs' && <DocsView setView={setView}/>}
    </main>

    {showRail && <RightRail setView={setView}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
